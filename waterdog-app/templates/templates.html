<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Express a Thought - AAC Keyboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Textarea configured for large, clear text input -->
        <textarea id="output-field" placeholder="Type here..."></textarea>
        
        <div class="controls">
            <button id="speak-btn">📢 Speak</button>
            <button id="ai-btn">🤖 AI Chat</button>
            <button id="clear-btn">🧹 Clear</button>
            <button id="hello-btn">👋 Hello</button>
            <button id="morn-btn">🌅 Good morning</button>
            <button id="help-btn">🤝 I need help</button>
            <button id="where-btn">❓ Where is it?</button>
            <button id="finish-btn">✅ Task finished</button>
            <button id="emergency-btn" style="background: #d32f2f; color: white;">🚨 EMERGENCY</button>
        </div>

        <div id="keyboard"></div>
    </div>

    <!-- AI Chat Modal Interface -->
    <div id="ai-modal" class="modal hidden">
        <div class="modal-content">
            <h3>AI Assistant</h3>
            <div id="chat-history"></div>
            <input type="text" id="ai-input" placeholder="Ask your question...">
            <div class="modal-buttons">
                <button id="send-ai-btn">Send</button>
                <button id="close-ai-btn">Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
